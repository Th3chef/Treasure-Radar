name: Bug report
description: The radar, the ledger, the world markers or the enemy and friendly dots don't work as described
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Thanks for the report! Please attach treasure_radar.log and chef_loader.log from %APPDATA%\Arrowhead\Helldivers2 (type that into the File Explorer address bar and press Enter). They show the options you picked, your HUD settings, where the radar sits, a summary of each mission and any errors.
  - type: input
    id: version
    attributes:
      label: Mod version
      placeholder: 0.7.0
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Which options you ticked (Loot Ledger, Size, Radar Position, Range, Rotate With View, Opacity, Radar Animation, World Markers, the keys) and which kinds (Enemy Structures, Enemies and which ones, SEAF Troopers and Civilians, Squadmates and Weapons included), and anything you changed in the F9 menu.
      placeholder: "Core, Loot Ledger, Size Small, Radar Position Top right, World Markers 50 m; all kinds, Enemies: Heavy only."
  - type: input
    id: loader
    attributes:
      label: Chef Shared Loader version
      description: The first line of chef_loader.log says it.
      placeholder: 1.0.0
    validations:
      required: true
  - type: input
    id: hud
    attributes:
      label: Screen resolution and HUD settings
      placeholder: "3440x1440, HUD Scale 0.85, HUD Edge Offset 1"
  - type: input
    id: game
    attributes:
      label: Game version / date of the last game update
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what happened instead (a screenshot helps). Solo, hosting or joining someone else's game?
    validations:
      required: true
  - type: textarea
    id: mods
    attributes:
      label: Other mods
      description: Other HUD mods, and anything else that replaces the game's boot script; your mod manager.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Drag treasure_radar.log and chef_loader.log here.
